<div class="auth-container">
    <div class="auth-card">
        <h2>Login</h2>

        <form (ngSubmit)="onSubmit(authForm)" #authForm="ngForm">
            <!-- Email -->
            <div class="form-group">
                <input type="email" ngModel name="email" placeholder="Email" required #email="ngModel" />
                <small class="error" *ngIf="email.invalid && email.touched">
                    {{ email.errors?.['required'] ? 'Email is required' : '' }}
                    {{ email.errors?.['email'] ? 'Enter a valid email address' : '' }}
                </small>
            </div>

            <!-- Password -->
            <div class="form-group">
                <input type="password" ngModel name="password" placeholder="Password" required minlength="6"
                    #password="ngModel" />
                <small class="error" *ngIf="password.invalid && password.touched">
                    {{ password.errors?.['required'] ? 'Password is required' : '' }}
                    {{ password.errors?.['minlength'] ? 'Minimum 6 characters' : '' }}
                </small>
            </div>

            <!-- Submit button -->
            <button type="submit" class="btn-primary" [disabled]="authForm.invalid">
                Login
            </button>
        </form>

        <!-- Toggle link -->
        <p class="toggle-text">
            Don't have an account?
            <a (click)="goToSignUp()">Sign Up</a>
        </p>
    </div>
</div>
